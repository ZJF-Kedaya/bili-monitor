name: deploy-bili-monitor

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: notify-success
        if: success()
        run: |
          curl -s -X POST "${{ secrets.WECOM_WEBHOOK }}" -H "Content-Type: application/json" -d "{"msgtype":"text","text":{"content":"✅ B站监控部署成功"}}"
      - name: notify-failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.WECOM_WEBHOOK }}" -H "Content-Type: application/json" -d "{"msgtype":"text","text":{"content":"❌ B站监控部署失败，请检查 GitHub Actions 日志"}}"
